[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openear-music"
version = "0.1.0"
description = "Privacy-first music diversity analytics for ListenBrainz"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "streamlit>=1.40"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
